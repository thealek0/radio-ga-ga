  <meta name="color-scheme" content="light dark" />
  <title>Radio GA GA</title>
  <script>
    // Resolve the saved preference before the page paints, including native controls.
    const systemTheme = window.matchMedia("(prefers-color-scheme: dark)");

    function applyThemePreference(value) {
      const preference = ["system", "light", "dark"].includes(value) ? value : "system";
      const theme = preference === "system" ? (systemTheme.matches ? "dark" : "light") : preference;
      document.documentElement.dataset.themePreference = preference;
      document.documentElement.dataset.theme = theme;
      document.documentElement.style.colorScheme = theme;
      return preference;
    }

    try {
      applyThemePreference(JSON.parse(localStorage.getItem("theme")));
    } catch (error) {
      applyThemePreference("system");
    }

    const followSystemTheme = () => applyThemePreference(document.documentElement.dataset.themePreference);
    if (systemTheme.addEventListener) {
      systemTheme.addEventListener("change", followSystemTheme);
    } else {
      systemTheme.addListener(followSystemTheme);
    }
  </script>

      background-size: auto 200vmax;

    }

    :root[data-theme="dark"] #backdrop {
      background-position: center 100%;
    }

    body {
      --theme-transition: 1200ms cubic-bezier(.4, 0, .2, 1);
      --theme-ink-transition: 120ms ease 420ms;
      color: var(--foreground);
      transition: color var(--theme-ink-transition);
    }

    .plain-text {
      font-family: "Open Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    .content {
      box-sizing: border-box;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      flex-direction: column;
    }

    #logo {
      margin-top: auto;
      padding: 40px;
    }

    /* the same soft drop shadow as the glass controls, so everything sits on one plane */
    #logo > svg {
      display: block;
      filter: drop-shadow(0 8px 24px rgba(0, 0, 0, 0.15));
    }

    #play {
      border: none;
      width: 64px;
      height: 64px;
      padding: 0;
      border-radius: 50%;
      cursor: pointer;
    }

    #play > svg {
      width: 100%;
      height: 100%;
      fill: var(--foreground);
      stroke: var(--foreground);
    }

    .round-button {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      padding: 0;
      border: none;
      border-radius: 50%;
      cursor: pointer;
    }

    .round-button > svg {
      width: 18px;
      height: 18px;
      fill: var(--foreground);
    }

    .transport {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    #play>#pause-icon,
    #play>#loader {
      display: none;
    }

    #volume-button {
      border: none;
      width: 24px;
      height: 24px;
      padding: 0;
      background-color: transparent;
      cursor: pointer;
    }

    #volume-button>#mute-icon {
      display: none;
    }

    .volume svg {
      fill: var(--foreground);
    }

    #logo > svg > g,
    #play > svg,
    .round-button > svg,
    .volume svg,
    .settings-button > svg {
      transition: fill var(--theme-ink-transition), stroke var(--theme-ink-transition);
    }

    button:focus-visible,
    select:focus-visible,
    input:focus-visible {
      outline: 2px solid var(--focus-color);
      outline-offset: 3px;
    }

    /* A quiet icon in the top right corner opens the native settings dialog. */
    .settings-button {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 10;
      width: 36px;
      height: 36px;
      padding: 6px;
      border: none;
      border-radius: 50%;
      background-color: transparent;
      opacity: 0.6;
      cursor: pointer;
      transition: opacity 0.2s ease, background-color 0.2s ease;
    }

    .settings-button:hover,
    .settings-button:focus-visible {
      opacity: 1;
      background-color: var(--glass-hover);
    }

    .settings-button > svg {
      display: block;
      width: 24px;
      height: 24px;
      fill: var(--foreground);
    }

    /* Settings window is a native <dialog>: the platform draws it and its controls.
       Only restore the spacing that the reset at the top removed */
    .settings-dialog {
      box-sizing: border-box;
      color-scheme: inherit;
      font-family: system-ui, sans-serif;
      font-size: 15px;
      line-height: 1.4;
      max-width: min(360px, calc(100vw - 32px));
    }

    .settings-dialog form {
      display: grid;
      gap: 16px;
    }

    .settings-dialog h2 {
      font-size: 20px;
      font-weight: 600;
    }

    .settings-dialog fieldset {
      display: grid;
      gap: 6px;
    }

    .settings-dialog legend {
      margin-bottom: 6px;
      font-weight: 600;
    }

    .settings-dialog label {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .settings-dialog small {
      font-size: 13px;
      opacity: 0.7;
    }

    .settings-dialog button {
      justify-self: end;
      font: inherit;
    }

    .settings-dialog select {
      box-sizing: border-box;
      width: 100%;
      min-height: 36px;
      padding: 4px 8px;
      font: inherit;
    }

    .settings-dialog,
    .settings-dialog select,
    .settings-dialog button {
      transition: background-color var(--theme-transition), color var(--theme-ink-transition), border-color var(--theme-transition);
    }

    #title {
      padding: 16px;
      font-size: 12px;
      font-weight: 300;
      text-transform: uppercase;
      text-shadow: var(--label-shadow);
      transition: text-shadow var(--theme-ink-transition);
    }

    .select {
      box-sizing: border-box;
      width: 320px;
      max-width: calc(100% - 32px);
      height: 44px;
      text-overflow: ellipsis;
      font-size: 16px;
      line-height: 20px;
      font-weight: 600;
      border: none;
      /* Keep the compact size at every viewport; reserve space for the chevron. */
      padding: 12px 40px 12px 16px;
      background-image: var(--select-arrow), linear-gradient(145deg, var(--glass-highlight), transparent 65%);
      background-repeat: no-repeat;
      background-position: right 16px center, center;
      background-size: 16px, 100% 100%;
      border-radius: 30px;
      -webkit-appearance: none;
      -moz-appearance: none;
      appearance: none;
      text-align-last: center;
      text-transform: uppercase;
      color: var(--foreground);
    }

    /* The native popup follows the selected color scheme. */
    .select option,
    .select optgroup {
      color: CanvasText;
      background-color: Canvas;
    }

    .volume {
      display: flex;
      align-items: center;
      gap: 12px;
      filter: drop-shadow(0 8px 24px rgba(0, 0, 0, 0.15));
    }

    .volume[hidden] {
      display: none;
    }

    .volume-max {
      flex-shrink: 0;
    }

    /* Range Input Styles */
    input[type="range"] {
      -webkit-appearance: none;
        appearance: none;
        width: min(240px, 50vw);
        margin: 0;
        background: transparent;
        cursor: pointer;
    }

    /* Chrome, Safari, Opera, Edge Chromium styles */
    input[type="range"]::-webkit-slider-runnable-track {
      background-color: var(--track-color);
      transition: background-color var(--theme-transition);
      border-radius: 0.5rem;
      height: 0.5rem;  
    }
    
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      margin-top: -4px;
      border-radius: 50%;
      background-color: var(--foreground);
      transition: background-color var(--theme-transition);
      height: 1rem;
      width: 1rem;
    }

    /* Firefox */
    input[type="range"]::-moz-range-track {
      background-color: var(--track-color);
      transition: background-color var(--theme-transition);
      border-radius: 0.5rem;
      height: 0.5rem;
    }

    input[type="range"]::-moz-range-thumb {
      border: none;
      border-radius: 0;
      border-radius: 50%;
      background-color: var(--foreground);
      transition: background-color var(--theme-transition);
      height: 1rem;
      width: 1rem;
    }    

    /* A solid surface is the fallback. Blur enhances it only where supported. */
    .select,
    .round-button,
    #play {
      --glass-rim:
        inset 0 0 0 1px var(--glass-edge),
        inset 0 0 3px 1px var(--glass-inner-edge),
        inset 0 3px 4px -2px var(--glass-top),
        inset 0 -3px 4px -2px var(--glass-bottom);
      background-color: var(--glass-solid);
      box-shadow:
        var(--glass-rim),
        inset 0 0 0 100px transparent,
        0 8px 24px var(--glass-shadow);
      transition:
        background-color var(--theme-transition),
        color var(--theme-ink-transition),
        box-shadow 0.16s ease,
        transform 0.16s ease;
    }

    .round-button,
    #play {
      background-image: linear-gradient(145deg, var(--glass-highlight), transparent 65%);
    }

    @supports ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
      .select,
      .round-button,
      #play {
        background-color: var(--glass-tint);
        /* Literal filter values also work around older Safari custom-property bugs. */
        -webkit-backdrop-filter: blur(1px) saturate(110%);
        backdrop-filter: blur(1px) saturate(110%);
      }
    }

    @media (hover: hover) and (pointer: fine) {
      .select:hover,
      .round-button:hover,
      #play:hover {
        box-shadow:
          var(--glass-rim),
          inset 0 0 0 100px var(--glass-hover),
          0 10px 28px var(--glass-shadow);
      }
    }

    .round-button:active,
    #play:active {
      transform: scale(0.96);
      box-shadow: var(--glass-rim), inset 0 0 0 100px var(--glass-pressed), 0 3px 10px var(--glass-shadow);
    }

    .select:focus-visible,
    .round-button:focus-visible,
    #play:focus-visible {
      box-shadow: var(--glass-rim), inset 0 0 0 100px transparent, 0 8px 24px var(--glass-shadow), 0 0 0 3px var(--focus-halo);
    }

    @media (prefers-reduced-transparency: reduce) {
      .select,
      .round-button,
      #play {
        background-color: var(--glass-solid);
        -webkit-backdrop-filter: none;
        backdrop-filter: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      body {
        --theme-transition: 0s;
        --theme-ink-transition: 0s;
      }

      .select,
      .round-button,
      #play {
        transition: none;
      }
    }

    @media (forced-colors: active) {
      .select,
      .round-button,
      #play {
        color: ButtonText;
        background: ButtonFace;
        border: 1px solid ButtonText;
        box-shadow: none !important;
        -webkit-backdrop-filter: none;
        backdrop-filter: none;
      }

      .select {
        appearance: auto;
      }
    }

    /* Keep the original flat logo and its fine strokes in both themes. */
    #logo > svg > g {
      fill: var(--foreground);
      fill-opacity: 0.85;
      filter: url(#logo-thin);
    }

    #player {
      margin-bottom: auto;
      padding: 28px 32px 32px;
      flex-direction: column;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
    }

    @media screen and (max-height: 500px) {
      /* Low screens: phones in landscape, small windows */
      #logo {
        padding: 12px;
      }

      #logo > svg {
        width: 144px;
        height: 72px;
      }

      #title {
        padding: 4px;
      }

      #player {
        padding: 10px 16px 8px;
        gap: 8px;
      }
    }

          "Radio Swiss Classic": "https://stream.srg-ssr.ch/m/rsc_de/mp3_128",
          "Your Classical. Relax": "https://relax.stream.publicradio.org/relax.mp3",
          "Your Classical. Peaceful Piano": "https://peacefulpiano.stream.publicradio.org/peacefulpiano.mp3",
          "Venice Classic Radio": "https://uk2.streamingpulse.com/ssl/vcr1"
        }
      },
      {
        name: "Eclectic",
        stations: {
          "Radio Paradise. Main Mix": "https://stream.radioparadise.com/mp3-192",
          "Radio Paradise. Mellow Mix": "https://stream.radioparadise.com/mellow-192",
          "Radio Paradise. Global Mix": "https://stream.radioparadise.com/global-192",
          "Radio Paradise. Eclectic Mix": "https://stream.radioparadise.com/eclectic-192",
          "KEXP Seattle": "https://kexp.streamguys1.com/kexp160.aac",
          "NTS 2": "https://stream-relay-geo.ntslive.net/stream2",
          "Серебряный Дождь": "https://silverrain.hostingradio.ru/silver128.mp3"
        }
      }
    ];

    const selectionStorageKey = "currentStation";
    const title = document.getElementById("title");
    const select = document.getElementById("selectStations");
    const audio = document.getElementsByTagName("audio")[0];
    const settingsButton = document.getElementById("settings-button");
    const settingsDialog = document.getElementById("settings-dialog");
    const themeSelect = document.getElementById("theme-select");
    const buttonPlay = document.getElementById("play");
    const playIconElement = document.getElementById("play-icon");
    const pauseIconElement = document.getElementById("pause-icon");
    const loader = document.getElementById("loader");
    const volumeButton = document.getElementById("volume-button");
    const volumeControls = document.querySelector(".volume");
    const volumeInput = document.getElementById("volume-input");
    const fullVolumeIconElement = document.getElementById("full-volume-icon");
    const muteIconElement = document.getElementById("mute-icon");

    const PAUSE_STATE = "pause";
    const PLAY_STATE = "play";
    const LOADING_STATE = "loading";

    let currentState = PAUSE_STATE;
    // Listening intent survives stream failures, but never an explicit pause.
    let wantsPlayback = false;
    let playAttempt = 0;
    let retryTimer = null;
    let watchdogTimer = null;
    let retryDelay = 1000;
    let lastPlaybackTime = 0;
    let lastProgressAt = 0;
    let stableSince = null;

    let savedVolume = 50;

    let currentSiteName;
    const savedSelection = getSavedSelection();
    let initAudioValue;

    init();

    function play() {
      if (wantsPlayback && currentState === PLAY_STATE) {
        return;
      }
      wantsPlayback = true;
      retryDelay = 1000;
      title.innerText = currentSiteName;
      startPlayback();
    }

    function clearRecoveryTimers() {
      clearTimeout(retryTimer);
      clearTimeout(watchdogTimer);
      retryTimer = null;
      watchdogTimer = null;
    }

    function startPlayback() {
      clearRecoveryTimers();
      if (!wantsPlayback) {
        return;
      }
      const attempt = ++playAttempt;
      lastPlaybackTime = 0;
      lastProgressAt = performance.now();
      stableSince = null;
      switchButtonState(LOADING_STATE);
      audio.load();
      watchPlayback();
      audio.play().catch(error => {
        // A previous station/load must not change the latest playback intent.
        if (attempt !== playAttempt || !wantsPlayback) {
          return;
        }
        if (error.name === "NotAllowedError") {
          pause();
          title.innerText = "Press play to resume";
          return;
        }
        scheduleReconnect();
      });
    }

    function pause() {
      wantsPlayback = false;
      ++playAttempt;
      clearRecoveryTimers();
      audio.pause();
      title.innerText = currentSiteName;
      // Already-paused media does not emit another pause event.
      switchButtonState(PAUSE_STATE);
    }

    function scheduleReconnect() {
      if (!wantsPlayback || retryTimer !== null) {
        return;
      }
      clearTimeout(watchdogTimer);
      watchdogTimer = null;
      stableSince = null;
      switchButtonState(LOADING_STATE);
      title.innerText = "Reconnecting…";
      // onLine is only a hint: a false value must not prevent recovery forever.
      const delay = navigator.onLine === false ? Math.max(10000, retryDelay) : retryDelay;
      retryDelay = Math.min(retryDelay * 2, 30000);
      retryTimer = setTimeout(startPlayback, delay);
    }

    function watchPlayback() {
      clearTimeout(watchdogTimer);
      if (!wantsPlayback || retryTimer !== null) {
        return;
      }
      watchdogTimer = setTimeout(() => {
        const now = performance.now();
        if (!audio.paused && !audio.ended && !audio.error && audio.currentTime !== lastPlaybackTime) {
          lastPlaybackTime = audio.currentTime;
          lastProgressAt = now;
          if (stableSince === null) {
            stableSince = now;
          }
          // A stream that briefly connects and drops should retain its backoff.
          if (now - stableSince >= 10000) {
            retryDelay = 1000;
          }
        } else if (now - lastProgressAt >= 15000) {
          scheduleReconnect();
          return;
        }
        watchPlayback();
      }, 3000);
    }

    // localStorage can be unavailable (private mode, blocked storage) or hold
    // a corrupted value; neither must break the player
    function readStorage(key) {
      try {
        return JSON.parse(localStorage.getItem(key));
      } catch (error) {
        return null;
      }
    }

    function writeStorage(key, value) {
      try {
        localStorage.setItem(key, JSON.stringify(value));
      } catch (error) {}
    }

    function saveSelection(item) {
      const siteName = item.parentElement.label;
      const stationName = item.label;
      currentSiteName = siteName;
      title.innerText = siteName;
      writeStorage(selectionStorageKey, { siteName, stationName, url: item.value });
      updateMediaSession();
    }

    function isSavedStation(stationName, url) {
      if (!savedSelection) {
        return false;
      }
      if (savedSelection.url) {
        return savedSelection.url === url;
      }
      // selections saved before urls were stored: groups were renamed, so match by station name
      return savedSelection.stationName === stationName;
    }

    // Lock screen, notification and headphone controls on phones and desktops
    function updateMediaSession() {
      if (!("mediaSession" in navigator)) {
        return;
      }
      const option = select.selectedOptions[0];
      navigator.mediaSession.metadata = new MediaMetadata({
        title: option.label,
        artist: option.parentElement.label,
        album: "Radio GA GA",
      });
    }

    function switchStation(step) {
      const count = select.options.length;
      select.selectedIndex = (select.selectedIndex + step + count) % count;
      select.dispatchEvent(new Event("change"));
    }

    function initMediaSession() {
      if (!("mediaSession" in navigator)) {
        return;
      }
      const handlers = {
        play: () => play(),
        pause: () => pause(),
        stop: () => pause(),
        previoustrack: () => switchStation(-1),
        nexttrack: () => switchStation(1),
      };
      Object.entries(handlers).forEach(([action, handler]) => {
        try {
          navigator.mediaSession.setActionHandler(action, handler);
        } catch (error) {
          // the browser does not support this action
        }
      });
      updateMediaSession();
    }

    function getSavedSelection() {
      const data = readStorage(selectionStorageKey);
      if (!data || typeof data !== "object") {
        return;
      }
      return data;
    }

    function setPlaybackState(state) {
      if ("mediaSession" in navigator) {
        navigator.mediaSession.playbackState = state;
      }
    }

    function switchButtonState(state) {
      currentState = state;
      switch (state) {
        case PLAY_STATE:
          pauseIconElement.style.display = "block";
          playIconElement.style.display = "none";
          loader.style.display = "none"
          buttonPlay.setAttribute("aria-label", "Pause");
          setPlaybackState("playing");
          break;
        case PAUSE_STATE:
          pauseIconElement.style.display = "none";
          playIconElement.style.display = "block";
          loader.style.display = "none"
          buttonPlay.setAttribute("aria-label", "Play");
          setPlaybackState("paused");
          break;
        case LOADING_STATE:
          pauseIconElement.style.display = "none";
          playIconElement.style.display = "none";
          loader.style.display = "block"
          buttonPlay.setAttribute("aria-label", "Stop loading");
          setPlaybackState("playing");
          break;
        default:
          break;
      }
    }

    // Sets volume 0..100 everywhere: audio, slider, icon and storage.
    // savedVolume keeps the last non-zero level, so unmute always has a level to restore
    function applyVolume(value) {
      const volume = Math.min(100, Math.max(0, Math.round(Number(value) || 0)));
      volumeInput.value = volume;
      audio.volume = volume / 100;
      if (volume > 0) {
        savedVolume = volume;
      }
      fullVolumeIconElement.style.display = volume > 0 ? "block" : "none";
      muteIconElement.style.display = volume > 0 ? "none" : "block";
      volumeButton.setAttribute("aria-label", volume > 0 ? "Mute" : "Unmute");
      writeStorage("volume", volume);
    }

    // Keep volume controls desktop-only. iPadOS can identify itself as a Mac,
    // and mobile browsers in desktop mode may expose only touch input hints.
    function canShowVolumeControls() {
      const mobilePlatform = /Android|iPhone|iPad|iPod|Mobi/i.test(navigator.userAgent);
      const touchMac = /Macintosh|MacIntel/i.test(navigator.userAgent + " " + navigator.platform)
        && navigator.maxTouchPoints > 1;
      const touchOnly = window.matchMedia("(hover: none) and (pointer: coarse)").matches;
      if (mobilePlatform || touchMac || touchOnly) {
        return false;
      }

      // A desktop browser may also restrict programmatic volume changes.
      try {
        const probe = new Audio();
        probe.volume = 0.5;
        return probe.volume === 0.5;
      } catch (error) {
        return false;
      }
    }

    function volumeInit() {
      if (!canShowVolumeControls()) {
        return;
      }

      const volumeFromStorage = readStorage("volume");
      applyVolume(typeof volumeFromStorage === "number" ? volumeFromStorage : savedVolume);
      volumeControls.hidden = false;
    }

    function init() {
      volumeInit();
      
      for (let i = 0; i < sites.length; i++) {
        const site = sites[i];
        const optionGroup = document.createElement("optgroup");
        optionGroup.label = site.name;
        const stations = site.stations;
        Object.keys(stations).forEach((key, index) => {
          const opt = document.createElement("option");
          opt.value = stations[key];
          opt.innerHTML = key;
          if (!initAudioValue && isSavedStation(key, stations[key])) {
            opt.selected = true;
            initAudioValue = stations[key];
            currentSiteName = optionGroup.label;
          }
          optionGroup.appendChild(opt);
        });
        select.appendChild(optionGroup);
      }

      if (!initAudioValue) {
        currentSiteName = sites[0].name;
        const firstStationKey = Object.keys(sites[0].stations)[0];
        initAudioValue = sites[0].stations[firstStationKey];
      }

      title.innerText = currentSiteName;

      audio.src = initAudioValue;
      initMediaSession();

      select.addEventListener("change", event => {
        event.stopPropagation();
        audio.src = event.target.value;
        saveSelection(event.target.selectedOptions[0]);
        wantsPlayback = true;
        retryDelay = 1000;
        startPlayback();
      });

      themeSelect.value = document.documentElement.dataset.themePreference;
      themeSelect.addEventListener("change", event => {
        const preference = applyThemePreference(event.target.value);
        themeSelect.value = preference;
        writeStorage("theme", preference);
      });

      // the browser handles the modal itself: backdrop, focus, Esc, returning focus on close
      settingsButton.addEventListener("click", () => settingsDialog.showModal());

      // Space toggles play/pause, unless a control has focus (Space already activates it)
      document.addEventListener("keydown", event => {
        if (event.code !== "Space" || event.target.closest("button, select, input")) {
          return;
        }
        event.preventDefault();
        buttonPlay.click();
      });

      document.getElementById("prev").addEventListener("click", event => {
        event.stopPropagation();
        switchStation(-1);
      });

      document.getElementById("next").addEventListener("click", event => {
        event.stopPropagation();
        switchStation(1);
      });

      buttonPlay.addEventListener("click", event => {
        event.stopPropagation();
        if (wantsPlayback) {
          pause();
          return;
        }
        play();
      });

      volumeButton.addEventListener("click", event => {
        event.stopPropagation();
        applyVolume(Number(volumeInput.value) > 0 ? 0 : savedVolume);
      });

      volumeInput.addEventListener("input", event => {
        event.stopPropagation();
        applyVolume(event.target.value);
      });

      volumeInput.addEventListener("wheel", event => {
        event.preventDefault();
        const step = 5;
        applyVolume(Number(volumeInput.value) + (event.deltaY < 0 ? step : -step));
      });

      audio.addEventListener("pause", () => {
        // Ignore an old queued pause if a newer play() has already started.
        if (!audio.paused) {
          return;
        }
        // Browsers can pause failed/ended streams themselves. Explicit controls
        // call pause() directly and clear intent even when audio is already paused.
        if (audio.ended || audio.error) {
          scheduleReconnect();
        } else {
          // Native/OS controls also count as an explicit pause.
          pause();
        }
      });

      audio.addEventListener("ended", scheduleReconnect);
      audio.addEventListener("error", scheduleReconnect);

      ["waiting", "seeking", "stalled"].forEach(type => {
        audio.addEventListener(type, () => {
          if (!wantsPlayback || (type === "stalled" && audio.readyState >= 3)) {
            return;
          }
          stableSince = null;
          switchButtonState(LOADING_STATE);
        });
      });

      // Only actual playback, not play/loadeddata, confirms that sound is running.
      audio.addEventListener("playing", () => {
        if (!wantsPlayback) {
          audio.pause();
          return;
        }
        clearTimeout(retryTimer);
        retryTimer = null;
        lastPlaybackTime = audio.currentTime;
        lastProgressAt = performance.now();
        stableSince = lastProgressAt;
        title.innerText = currentSiteName;
        switchButtonState(PLAY_STATE);
        watchPlayback();
      });

      window.addEventListener("online", () => {
        if (wantsPlayback && (currentState === LOADING_STATE || audio.error || audio.ended || audio.paused)) {
          startPlayback();
        }
      });

      switchButtonState(currentState)
    }
  </script>
</body>

</html>
